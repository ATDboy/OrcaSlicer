name: Materialize OrcaBrick source

on:
  push:
    branches:
      - orcabrick-2.4.2
    paths:
      - '.github/workflows/orcabrick_bootstrap.yml'

permissions:
  contents: write

jobs:
  apply_patch:
    name: Apply OrcaBrick patch
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable OrcaSlicer
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: orcabrick-2.4.2

      - name: Apply the reviewed source patch
        shell: bash
        run: |
          git apply --check --exclude=.github/workflows/orcabrick_windows.yml patches/orcabrick-2.4.2.patch
          git apply --index --exclude=.github/workflows/orcabrick_windows.yml patches/orcabrick-2.4.2.patch
          git rm patches/orcabrick-2.4.2.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Port Nanashi bricklaying to OrcaSlicer 2.4.2"
          git push origin HEAD:orcabrick-2.4.2
