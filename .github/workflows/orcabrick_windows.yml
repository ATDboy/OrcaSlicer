name: Build OrcaBrick

on:
  push:
    branches:
      - orcabrick-2.4.2
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/orcabrick_smoke_test.py'
      - 'version.inc'
      - 'CMakeLists.txt'
      - 'resources/profiles/SecKit/**'
      - '.github/workflows/orcabrick_windows.yml'
      - '.github/workflows/build_orca.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orcabrick-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_orcabrick:
    name: Validate OrcaBrick source and proof parser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate proof script and changed lines
        shell: bash
        run: |
          python -m py_compile scripts/orcabrick_smoke_test.py
          python scripts/orcabrick_smoke_test.py --self-test --repo .
          git diff --check HEAD^ HEAD

  build_windows_x64:
    name: Build Windows x64 installer
    needs: validate_orcabrick
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      build-deps-only: false
      force-build: false
    secrets: inherit

  # Linux ships as an AppImage - the equivalent deliverable to the Windows installer.
  # amd64 passes an empty arch, matching build_all.yml, so it reuses the existing
  # 'linux-clang' dependency cache rather than starting a second one.
  build_linux_x86_64:
    name: Build Linux x86_64 AppImage
    needs: validate_orcabrick
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ubuntu-24.04
      arch: ''
      build-deps-only: false
      force-build: false
    secrets: inherit

  # Nothing else runs the unit tests. build_orca.yml compiles tests/ only on the aarch64 leg
  # (its "tests" flag is false for amd64 without a self-hosted runner), CMake defaults
  # BUILD_TESTS to OFF, and no leg here invokes ctest at all - build 22 proves it, its "Upload
  # Test Artifact" step was skipped. So tests/fff_print/test_orcabrick_preview.cpp, which exists
  # to check the G-code to Preview mapping against libvgcode's contract, was compiled nowhere and
  # run nowhere. This job builds it and runs it.
  #
  # It waits for the Linux leg rather than racing it, so the dependency cache it restores is
  # guaranteed to have been written.
  unit_tests:
    name: Unit tests
    needs: build_linux_x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The key build_check_cache.yml computes for the amd64 Linux leg. Restore only: the leg
      # that built them owns saving them.
      - name: Load cached dependencies
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: linux-clang-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}
          fail-on-cache-miss: true

      - name: Apt-Install Dependencies
        uses: ./.github/actions/apt-install-deps

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"

      - name: Build slicer and tests
        shell: bash
        run: ./build_linux.sh -tsrlL

      - name: Run unit tests
        timeout-minutes: 20
        shell: bash
        run: scripts/run_unit_tests.sh

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: OrcaBrick_unit_test_logs
          path: build/tests/**/*.log

      # scripts/orcabrick_smoke_test.py has always had a G-code proof - slice the same model
      # with Bricklaying off and on and check that the walls really move half a layer up - but
      # nothing ever ran it: the validate job only passes --self-test, which reads sources and
      # slices nothing. So no leg has ever confirmed that Bricklaying changes the G-code at all,
      # which left "Preview looks wrong" impossible to split into a wrong Preview or a wrong
      # slice. This job already built a slicer; make it answer that. The summary is printed to
      # the log, so the answer is readable without downloading the artifact.
      - name: Prove Bricklaying in the G-code
        # A red ctest must not hide this: it is the only evidence of what the slicer emits.
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        run: |
          python3 scripts/orcabrick_smoke_test.py \
            --exe build/package/bin/orca-slicer \
            --repo . \
            --workdir "${{ runner.temp }}/orcabrick-proof"

      - name: Upload the G-code proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrcaBrick_gcode_proof
          path: ${{ runner.temp }}/orcabrick-proof/**
          if-no-files-found: warn

  # The same AppImage built against Ubuntu 22.04 instead, for every distro that is not Ubuntu
  # 24.04 or newer. An AppImage deliberately takes glibc, GTK and the GL stack from the host
  # (see scripts/appimage_lib_policy.sh), so the build host's glibc is the floor for every
  # system it can run on: 24.04 links against 2.39, which refuses to start on Debian 12 (2.36),
  # Ubuntu 22.04 and Mint 21 (2.35) or openSUSE Leap 15.6 (2.38). Building on 22.04 lowers the
  # floor to 2.35 and covers those and everything newer.
  #
  # It builds inside a container rather than on an ubuntu-22.04 runner so it does not depend on
  # that runner label continuing to exist. build_linux.sh -g already does exactly this, and
  # scripts/linux.d/debian already special-cases Ubuntu 22.x, so no new build logic is needed.
  build_linux_x86_64_compat:
    name: Build Linux x86_64 AppImage (Ubuntu 22.04 base)
    needs: validate_orcabrick
    runs-on: ubuntu-24.04
    env:
      ORCA_DOCKER_BASE_IMAGE: ubuntu:22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the OrcaBrick version
        shell: bash
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          echo "ver_pure=$ver_pure" >> "$GITHUB_ENV"
          echo "ver=V$ver_pure" >> "$GITHUB_ENV"

      # Keyed separately from the 24.04 deps: they are built against a different glibc and the
      # two must never be restored into each other's build.
      - name: Load cached dependencies
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: linux-clang-ubuntu2204-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}

      - name: Build dependencies, slicer and AppImage in an Ubuntu 22.04 container
        shell: bash
        run: ./build_linux.sh -g -disrlL

      # The container runs as root, so everything it writes into the mounted workspace ends up
      # root-owned. The cache action's post-job step re-evaluates hashFiles('deps/**') as the
      # runner user, cannot read those files, and fails the whole job after the AppImage has
      # already been built and uploaded. Hand the workspace back before that happens.
      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"

      # The audit resolves every dependency the AppImage deliberately does NOT bundle - glibc,
      # GTK, the GL stack, GStreamer, webkit - against the machine it runs on. The build happened
      # inside the container, so those libraries live there and not on the bare runner, and the
      # audit reported all nine of them as unresolved. Install them here so it checks the policy
      # (is this library one the host is expected to provide?) rather than the runner's contents.
      - name: Apt-Install Dependencies
        uses: ./.github/actions/apt-install-deps

      - name: Check bundled libraries
        shell: bash
        run: ./scripts/check_appimage_libs.sh ./build/package ./build/package/bin/orca-slicer

      - name: Name the AppImage after its base
        shell: bash
        run: |
          appimage=./build/OrcaSlicer_Linux_AppImage_Ubuntu2204_${{ env.ver }}.AppImage
          mv -n "./build/OrcaSlicer_Linux_V${{ env.ver_pure }}.AppImage" "$appimage"
          chmod +x "$appimage"

      - name: Upload artifacts Ubuntu 22.04
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Linux_ubuntu_2204_${{ env.ver }}
          path: ./build/OrcaSlicer_Linux_AppImage_Ubuntu2204_${{ env.ver }}.AppImage
