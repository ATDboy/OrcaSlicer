name: Publish OrcaBrick installer

on:
  push:
    branches:
      - orcabrick-2.4.2
    paths:
      - '.github/workflows/orcabrick_publish.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-orcabrick-v2.4.2-1
  cancel-in-progress: false

jobs:
  publish:
    name: Publish one-click Windows installer
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: orcabrick-v2.4.2-1
    steps:
      - name: Download successful Windows installer
        run: |
          gh run download 32503433865 \
            --repo "$GITHUB_REPOSITORY" \
            --name "OrcaSlicer_Windows_V2.4.2+OrcaBrick.1_x64" \
            --dir release-files

      - name: Verify installer
        run: |
          installer=$(find release-files -type f -name '*.exe' -print -quit)
          test -n "$installer"
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
          sha256sum "$installer"

      - name: Create permanent OrcaBrick release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$INSTALLER" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$INSTALLER" \
              --repo "$GITHUB_REPOSITORY" \
              --target orcabrick-2.4.2 \
              --title "OrcaBrick 2.4.2-1 for Windows" \
              --notes "OrcaSlicer 2.4.2 stable with Nanashi-style native Bricklaying (staggered walls). The checkbox is under Process > Strength > Walls. Built from commit d86273ae55b35aaba2429c5879df733d45097b29."
          fi

      - name: Write release-ready marker
        run: |
          asset=$(basename "$INSTALLER")
          checksum=$(sha256sum "$INSTALLER" | cut -d' ' -f1)
          download_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$asset"
          printf '# OrcaBrick installer is ready\n\nDirect download: %s\n\nSHA-256: %s\n' "$download_url" "$checksum" > release-ready.md
          encoded=$(base64 -w0 release-ready.md)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/ORCABRICK_RELEASE_READY.md" \
            -f message="Mark OrcaBrick release ready" \
            -f content="$encoded" \
            -f branch=orcabrick-2.4.2
